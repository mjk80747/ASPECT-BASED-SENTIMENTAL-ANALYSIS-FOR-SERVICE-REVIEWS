<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit User</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: radial-gradient(circle at top right, rgba(139, 92, 246, 0.12), transparent 45%), linear-gradient(135deg, #0f0f0f 0%, #141414 100%);
            color: #ffffff;
        }
        .card {
            width: min(92vw, 540px);
            background: #171717;
            border: 1px solid #27272a;
            border-radius: 20px;
            padding: 32px 28px;
            box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.5), 0 0 20px rgba(139, 92, 246, 0.1);
        }
        h2 {
            margin-top: 0;
            margin-bottom: 20px;
            color: #ffffff;
            font-weight: 800;
        }
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }
        .full { grid-column: 1 / -1; }
        label {
            display: block;
            margin-bottom: 8px;
            color: #a1a1aa;
            font-weight: 600;
            font-size: 0.92rem;
        }
        input, select {
            width: 100%;
            padding: 12px 14px;
            border-radius: 10px;
            border: 1px solid #27272a;
            background: #1f1f1f;
            color: #ffffff;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.2s ease;
        }
        input:focus, select:focus {
            border-color: #8b5cf6;
            background: #171717;
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.2);
        }
        .actions {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            margin-top: 24px;
            flex-wrap: wrap;
        }
        .btn {
            display: inline-block;
            text-decoration: none;
            border: none;
            cursor: pointer;
            padding: 12px 20px;
            border-radius: 10px;
            font-weight: 700;
            transition: all 0.2s ease;
        }
        .primary { background: linear-gradient(135deg, #8b5cf6, #7c3aed); color: white; box-shadow: 0 4px 12px rgba(139, 92, 246, 0.3); }
        .primary:hover { transform: translateY(-1px); }
        .secondary { background: #1f1f1f; color: #a1a1aa; border: 1px solid #27272a; }
        .secondary:hover { background: #27272a; color: #ffffff; }
        .error {
            color: #fca5a5;
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            padding: 10px 14px;
            border-radius: 10px;
            margin-bottom: 16px;
            font-weight: 600;
        }
        @media (max-width: 600px) {
            .form-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>Edit User</h2>

        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}

        <form method="post" action="{{ url_for('edit_user', user_id=user.id) }}">
            <div class="form-grid">
                <div class="full">
                    <label for="user">Username</label>
                    <input type="text" id="user" name="user" value="{{ user.user }}" required>
                </div>
                <div>
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" value="{{ user.name or '' }}">
                </div>
                <div>
                    <label for="role">Role</label>
                    <select id="role" name="role">
                        <option value="user" {% if (user.role or 'user') == 'user' %}selected{% endif %}>User</option>
                        <option value="admin" {% if (user.role or 'user') == 'admin' %}selected{% endif %}>Admin</option>
                    </select>
                </div>
                <div class="full">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" value="{{ user.email or '' }}">
                </div>
                <div class="full">
                    <label for="mobile">Mobile</label>
                    <input type="text" id="mobile" name="mobile" value="{{ user.mobile or '' }}">
                </div>
                <div class="full">
                    <label for="password">New Password (leave blank to keep current)</label>
                    <input type="password" id="password" name="password" value="">
                </div>
            </div>

            <div class="actions">
                <button type="submit" class="btn primary">Save Changes</button>
                <a href="{{ url_for('admin_dashboard') }}" class="btn secondary">Cancel</a>
            </div>
        </form>
    </div>
</body>
</html>
