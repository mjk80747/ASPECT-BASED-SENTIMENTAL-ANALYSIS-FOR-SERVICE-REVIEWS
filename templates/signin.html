<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <title>Sign-in</title>
</head>

<body>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap');

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Montserrat', sans-serif;
}

body {
    background-color: #c9d6ff;
    background: linear-gradient(to right, #e2e2e2, #c9d6ff);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    height: 100vh;
}

.container {
    background-color: #fff;
    border-radius: 30px;
    box-shadow: 0 5px 15px rgba(0, 0, 0, 0.35);
    position: relative;
    overflow: hidden;
    width: 768px;
    max-width: 100%;
    min-height: 480px;
}

.container p {
    font-size: 14px;
    line-height: 20px;
    letter-spacing: 0.3px;
    margin: 20px 0;
}

.container span {
    font-size: 12px;
}

.container a {
    color: #333;
    font-size: 13px;
    text-decoration: none;
    margin: 15px 0 10px;
}

.container button {
    background-color: orange;
    color: #fff;
    font-size: 12px;
    padding: 10px 45px;
    border: 1px solid transparent;
    border-radius: 8px;
    font-weight: 600;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    margin-top: 10px;
    cursor: pointer;
}

.container button:hover {
    background-color: #00a1ff;
}

.container button.hidden {
    background-color: transparent;
    border-color: #fff;
}

.container form {
    background-color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    padding: 0 40px;
    height: 100%;
}

.container input {
    background-color: #eee;
    border: none;
    margin: 8px 0;
    padding: 10px 15px;
    font-size: 13px;
    border-radius: 8px;
    width: 100%;
    outline: none;
}

.signup-error {
    display: none;
    width: 100%;
    margin: 4px 0 8px;
    padding: 9px 12px;
    border-left: 4px solid #c33764;
    border-radius: 6px;
    background: #fff1f4;
    color: #a32148;
    font-size: 12px;
    line-height: 1.4;
}

.signup-error.is-visible {
    display: block;
}

.password-container {
    position: relative;
    width: 100%;
}

.password-container input {
    padding-right: 35px; /* space for the icon */
}

.password-container .eye-icon {
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    cursor: pointer;
    padding: 0;
    border: 0;
    background: transparent;
    color: #64748b;
    line-height: 1;
    margin: 0;
    width: 28px;
    height: 28px;
    display: grid;
    place-items: center;
    transition: color 180ms ease, transform 180ms ease;
}

.password-container .eye-icon i {
    transition: transform 180ms ease;
}

.password-container .eye-icon:hover {
    color: #0f5f8c;
    transform: translateY(-50%) scale(1.08);
}

.password-container .eye-icon:active {
    transform: translateY(-50%) scale(0.94);
}

.password-container .eye-icon.is-visible {
    color: #0f5f8c;
}

.password-container .eye-icon.is-visible i {
    transform: rotate(-8deg);
}

.password-container .eye-icon:focus-visible {
    outline: 2px solid #00a1ff;
    outline-offset: 2px;
    border-radius: 50%;
}

.form-container {
    position: absolute;
    top: 0;
    height: 100%;
    transition: all 0.6s ease-in-out;
}

.sign-in {
    left: 0;
    width: 50%;
    z-index: 2;
}

.container.active .sign-in {
    transform: translateX(100%);
}

.sign-up {
    left: 0;
    width: 50%;
    opacity: 0;
    z-index: 1;
}

.container.active .sign-up {
    transform: translateX(100%);
    opacity: 1;
    z-index: 5;
    animation: move 0.6s;
}

@keyframes move {
    0%,
    49.99% {
        opacity: 0;
        z-index: 1;
    }

    50%,
    100% {
        opacity: 1;
        z-index: 5;
    }
}

.social-icons {
    margin: 20px 0;
}

.social-icons a {
    border: 1px solid #ccc;
    border-radius: 20%;
    display: inline-flex;
    justify-content: center;
    align-items: center;
    margin: 0 3px;
    width: 40px;
    height: 40px;
}

.toggle-container {
    position: absolute;
    top: 0;
    left: 50%;
    width: 50%;
    height: 100%;
    overflow: hidden;
    transition: all 0.6s ease-in-out;
    border-radius: 150px 0 0 100px;
    z-index: 1000;
}

.container.active .toggle-container {
    transform: translateX(-100%);
    border-radius: 0 150px 100px 0;
}

.toggle {
    background-color: linear-gradient(to left, #00a1ff, #00ff8f);
    height: 100%;
    background: linear-gradient(to right, #c33764, #1d2671);
    color: #fff;
    position: relative;
    left: -100%;
    height: 100%;
    width: 200%;
    transform: translateX(0);
    transition: all 0.6s ease-in-out;
}

.container.active .toggle {
    transform: translateX(50%);
}

.toggle-panel {
    position: absolute;
    width: 50%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    padding: 0 30px;
    text-align: center;
    top: 0;
    transform: translateX(0);
    transition: all 0.6s ease-in-out;
}

.toggle-left {
    transform: translateX(-200%);
}

.container.active .toggle-left {
    transform: translateX(0);
}

.toggle-right {
    right: 0;
    transform: translateX(0);
}

.container.active .toggle-right {
    transform: translateX(200%);
}
    </style>

    <div class="container" id="container">
        <div class="form-container sign-up">
            <form action="/signup" method="get" id="signup-form" novalidate>
                <h1>Create Account</h1>
                <div class="social-icons">
                    <a href="#" class="icon"><i class="fa-brands fa-google-plus-g"></i></a>
                    <a href="#" class="icon"><i class="fa-brands fa-facebook-f"></i></a>
                    <a href="#" class="icon"><i class="fa-brands fa-github"></i></a>
                    <a href="#" class="icon"><i class="fa-brands fa-linkedin-in"></i></a>
                </div>
                <span>or use your email for registration</span>
                <input type="text" name="user" placeholder="Username">
                <input type="text" name="name" placeholder="Name">
                <input type="email" name="email" placeholder="Email" pattern="[a-z0-9._%+\-]+@[a-z0-9.\-]+\.[a-z]{2,}$" required oninvalid="this.setCustomValidity('Enter a valid email address, for example name@example.com.')" oninput="this.setCustomValidity('')">
                <input type="tel" name="mobile" placeholder="Phone Number" pattern="[6-9]{1}[0-9]{9}" required oninvalid="this.setCustomValidity('Enter a 10-digit phone number starting with 6, 7, 8, or 9.')" oninput="this.setCustomValidity('')">
                <div class="password-container">
                    <input type="password" name="password" id="signup-password" placeholder="Password" pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}" required oninvalid="this.setCustomValidity('Password must be at least 8 characters and include uppercase, lowercase, and a number.')" oninput="this.setCustomValidity('')">
                    <button type="button" class="eye-icon" id="eye-icon-signup" aria-label="Show password" title="Show password"><i class="fa-regular fa-eye" aria-hidden="true"></i></button>
                </div>
                <p class="signup-error" id="signup-error" role="alert"></p>
                <button>Sign Up</button>
            </form>
        </div>
        <div class="form-container sign-in">
            <form action="/signin" method="get">
                <h1>Sign In</h1>
                <div class="social-icons">
                    <a href="#" class="icon"><i class="fa-brands fa-google-plus-g"></i></a>
                    <a href="#" class="icon"><i class="fa-brands fa-facebook-f"></i></a>
                    <a href="#" class="icon"><i class="fa-brands fa-github"></i></a>
                    <a href="#" class="icon"><i class="fa-brands fa-linkedin-in"></i></a>
                </div>
                <span>or use your Username password</span>
                <input type="text" name="user" placeholder="Username">
                <div class="password-container">
                    <input type="password" name="password" id="signin-password" placeholder="Password">
                    <button type="button" class="eye-icon" id="eye-icon-signin" aria-label="Show password" title="Show password"><i class="fa-regular fa-eye" aria-hidden="true"></i></button>
                </div>
          
                <button>Sign In</button>
            </form>
        </div>
        <div class="toggle-container">
            <div class="toggle">
                <div class="toggle-panel toggle-left">
                    <h1>Welcome Back !</h1>
                    <p>Enter your personal details to use all of site features</p>
                    <button class="hidden" id="login">Sign In</button>
                </div>
                <div class="toggle-panel toggle-right">
                    <h1>Welcome, Friend!</h1>
                    <p>Enter your personal details to use all of site features</p>
                    <button class="hidden" id="register">Sign Up</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const container = document.getElementById('container');
        const registerBtn = document.getElementById('register');
        const loginBtn = document.getElementById('login');
        const eyeIconSignup = document.getElementById('eye-icon-signup');
        const eyeIconSignin = document.getElementById('eye-icon-signin');
        const signupEye = eyeIconSignup.querySelector('i');
        const signinEye = eyeIconSignin.querySelector('i');
        const signupPassword = document.getElementById('signup-password');
        const signinPassword = document.getElementById('signin-password');
        const signupForm = document.getElementById('signup-form');
        const signupError = document.getElementById('signup-error');

        registerBtn.addEventListener('click', () => {
            container.classList.add("active");
        });

        loginBtn.addEventListener('click', () => {
            container.classList.remove("active");
        });

        signupForm.addEventListener('submit', (event) => {
            const email = signupForm.elements.email;
            const mobile = signupForm.elements.mobile;
            const password = signupForm.elements.password;
            let message = '';

            if (!email.value.trim()) {
                message = 'Email is required.';
            } else if (!email.validity.valid) {
                message = 'Email is invalid. Use a format such as name@example.com.';
            } else if (!mobile.value.trim()) {
                message = 'Phone number is required.';
            } else if (!mobile.validity.valid) {
                message = 'Phone number must contain 10 digits and start with 6, 7, 8, or 9.';
            } else if (!password.value.trim()) {
                message = 'Password is required.';
            } else if (!password.validity.valid) {
                message = 'Password must contain at least 8 characters, one uppercase letter, one lowercase letter, and one number.';
            }

            if (message) {
                event.preventDefault();
                signupError.textContent = message;
                signupError.classList.add('is-visible');
            }
        });

        signupForm.addEventListener('input', () => {
            signupError.classList.remove('is-visible');
        });

        eyeIconSignup.addEventListener('click', () => {
            const isHidden = signupPassword.type === 'password';
            signupPassword.type = isHidden ? 'text' : 'password';
            signupEye.classList.toggle('fa-eye', !isHidden);
            signupEye.classList.toggle('fa-eye-slash', isHidden);
            eyeIconSignup.classList.toggle('is-visible', isHidden);
            eyeIconSignup.setAttribute('aria-label', isHidden ? 'Hide password' : 'Show password');
            eyeIconSignup.setAttribute('title', isHidden ? 'Hide password' : 'Show password');
        });

        eyeIconSignin.addEventListener('click', () => {
            const isHidden = signinPassword.type === 'password';
            signinPassword.type = isHidden ? 'text' : 'password';
            signinEye.classList.toggle('fa-eye', !isHidden);
            signinEye.classList.toggle('fa-eye-slash', isHidden);
            eyeIconSignin.classList.toggle('is-visible', isHidden);
            eyeIconSignin.setAttribute('aria-label', isHidden ? 'Hide password' : 'Show password');
            eyeIconSignin.setAttribute('title', isHidden ? 'Hide password' : 'Show password');
        });
    </script>
</body>

</html>
