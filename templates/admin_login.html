<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: radial-gradient(circle at top right, rgba(139, 92, 246, 0.15), transparent 50%), linear-gradient(135deg, #0f0f0f 0%, #141414 100%);
            color: #ffffff;
        }
        .login-box {
            width: min(92vw, 420px);
            background: #171717;
            border: 1px solid #27272a;
            border-radius: 20px;
            padding: 36px 32px;
            box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.5), 0 0 25px rgba(139, 92, 246, 0.12);
        }
        .title {
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 6px;
            text-align: center;
            color: #ffffff;
        }
        .subtitle {
            text-align: center;
            color: #a1a1aa;
            margin-bottom: 24px;
            font-size: 0.92rem;
            font-weight: 500;
        }
        .form-group {
            margin-bottom: 18px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #a1a1aa;
            font-weight: 600;
            font-size: 0.92rem;
        }
        input {
            width: 100%;
            padding: 12px 14px;
            border-radius: 10px;
            border: 1px solid #27272a;
            background: #1f1f1f;
            color: #ffffff;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.2s ease;
        }
        input:focus {
            border-color: #8b5cf6;
            background: #171717;
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.2);
        }
        button {
            width: 100%;
            padding: 13px 18px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #8b5cf6, #7c3aed);
            color: white;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: 8px;
            box-shadow: 0 4px 12px rgba(139, 92, 246, 0.35);
            transition: all 0.2s ease;
        }
        button:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(139, 92, 246, 0.45);
        }
        .error {
            color: #fca5a5;
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 10px;
            padding: 10px 12px;
            margin-bottom: 16px;
            font-size: 0.9rem;
            font-weight: 600;
        }
        .note {
            text-align: center;
            font-size: 0.85rem;
            color: #a1a1aa;
            margin-top: 20px;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <div class="title">Admin Login</div>
        <div class="subtitle">Secure access to admin dashboard</div>

        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}

        <form method="post" action="{{ url_for('admin_login') }}">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Enter admin username" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter admin password" required>
            </div>
            <button type="submit">Login to Dashboard</button>
        </form>

        <div class="note">Default admin account: admin / admin123</div>
    </div>
</body>
</html>
