<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <title>OTP Form</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            background: radial-gradient(circle at top right, rgba(139, 92, 246, 0.15), transparent 50%), linear-gradient(135deg, #0f0f0f 0%, #141414 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            color: #ffffff;
        }

        .otp-container {
            background-color: #171717;
            border: 1px solid #27272a;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6), 0 0 25px rgba(139, 92, 246, 0.15);
            overflow: hidden;
            width: 400px;
            padding: 40px;
            text-align: center;
        }

        .otp-container h1 {
            font-size: 28px;
            margin-bottom: 20px;
            color: #ffffff;
        }

        .otp-container span {
            font-size: 15px;
            color: #a1a1aa;
            margin-bottom: 20px;
            display: block;
        }

        .otp-container .error {
            color: #fca5a5;
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 14px;
            margin-bottom: 12px;
        }

        .otp-container input {
            background-color: #1f1f1f;
            border: 1px solid #27272a;
            color: #ffffff;
            margin: 15px 0;
            padding: 12px 18px;
            font-size: 16px;
            border-radius: 10px;
            width: 100%;
            outline: none;
            transition: all 0.3s;
        }

        .otp-container input:focus {
            border-color: #8b5cf6;
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.2);
        }

        .otp-container button {
            background: linear-gradient(135deg, #8b5cf6, #7c3aed);
            color: #fff;
            font-size: 15px;
            padding: 12px 25px;
            border: 1px solid transparent;
            border-radius: 10px;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(139, 92, 246, 0.3);
            transition: all 0.3s;
            margin-top: 20px;
            width: 100%;
        }

        .otp-container button:hover {
            background: linear-gradient(135deg, #9353d3, #8b5cf6);
            transform: translateY(-1px);
        }

        .otp-container .resend-btn {
            background: #1f1f1f;
            border: 1px solid #27272a;
            color: #a1a1aa;
            margin-top: 15px;
            box-shadow: none;
        }

        .otp-container .resend-btn:hover {
            background: #27272a;
            color: #ffffff;
        }

        .otp-container .no-receive {
            margin-top: 20px;
            font-size: 14px;
            color: #a1a1aa;
        }

        .otp-container .no-receive a {
            color: orange;
            text-decoration: none;
        }

        .otp-container .no-receive a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <form action="/otp" method="post">
        <div class="otp-container">
            <h1>OTP Verification</h1>
            <span>Enter the OTP sent to your email</span>
            {% if error %}
            <p class="error">{{ error }}</p>
            {% endif %}
            <input type="text" name="message" placeholder="Enter OTP">
            <button>Submit</button>

        </div>
    </form>
</body>

</html>
